name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      - name: Syntax check
        run: |
          node --check src/blackwell-db.js
          node --check src/crypto.js
          node --check src/secure-collection.js
          node --check src/adapters/file-adapter.js
          node --check src/adapters/indexeddb-adapter.js
